<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Generate Bill</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <style>
  :root {
    --peacock: #016A70;
    --peacock-dark: #014d50;
    --accent: #02A2A8;
    --light-bg: #F5FEFF;
    --text: #023c3f;
    --card-bg: #ffffff;
    --border: #d9efef;
  }

  body {
    font-family: Inter, Arial, sans-serif;
    background: var(--light-bg);
    padding: 25px;
    margin: 0;
    color: var(--text);
  }

  .wrap {
    max-width: 1000px;
    margin: 0 auto;
    background: var(--card-bg);
    padding: 26px;
    border-radius: 14px;
    box-shadow: 0 8px 26px rgba(0, 0, 0, 0.08);
    border: 1px solid rgba(1,106,112,0.15);
  }

  h2 {
    margin: 0 0 6px;
    color: var(--peacock-dark);
    font-size: 26px;
  }

  .muted {
    font-size: 14px;
    color: #577c7e;
  }

  .top-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .back {
    background: var(--peacock);
    color: white;
    padding: 8px 16px;
    border-radius: 10px;
    text-decoration: none;
    font-size: 14px;
    transition: 0.2s;
    font-weight: 600;
  }

  .back:hover {
    background: var(--peacock-dark);
  }

  label {
    display: block;
    margin-top: 14px;
    font-weight: 600;
    color: var(--peacock-dark);
  }

  input, textarea, select {
    padding: 12px;
    width: 100%;
    margin-top: 6px;
    border: 1px solid #cfdede;
    border-radius: 8px;
    font-size: 15px;
    box-sizing: border-box;
    background: #ffffff;
    color: var(--text);
    transition: 0.2s;
  }

  input:focus, textarea:focus, select:focus {
    border: 1px solid var(--peacock);
    outline: none;
    box-shadow: 0 0 4px rgba(1,106,112,0.25);
  }

  /* SEARCH fixes & spacing */
  .search-wrapper {
    margin-top: 10px;
    margin-bottom: 6px;
  }

  #searchName {
    margin-bottom: 6px; /* small gap before search results */
  }

  #searchResults {
    border: 1px solid #c3e2e2;
    border-radius: 8px;
    padding: 6px;
    background: white;
    max-height: 220px;
    overflow-y: auto;
    margin-top: 8px;            /* <- ensures spacing under input */
    display: none;
    box-shadow: 0 6px 18px rgba(0,0,0,0.05);
  }

  /* each result row */
  .sr-item {
    padding: 10px;
    border-bottom: 1px solid #eef4f4;
    cursor: pointer;
    font-size: 15px;
    transition: background 0.12s;
  }
  .sr-item:last-child { border-bottom: none; }
  .sr-item:hover { background: #EAFDFC; }

  .products {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    margin-top: 10px;
  }

  .product-checkbox {
    padding: 10px 14px;
    border: 1px solid #c0dadb;
    background: #ffffff;
    border-radius: 8px;
    cursor: pointer;
    font-size: 15px;
    transition: 0.25s;
    color: var(--peacock-dark);
  }

  .product-checkbox:hover {
    background: var(--light-bg);
    border-color: var(--peacock);
  }

  .inline-row {
    display: flex;
    gap: 12px;
  }

  .inline-row > * {
    flex: 1;
  }

  .item-row {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-top: 12px;
    background: #f7ffff;
    border: 1px solid #cfeeee;
    padding: 12px;
    border-radius: 10px;
  }

  .item-row input {
    width: 130px;
  }

  .actions {
    margin-top: 20px;
    display: flex;
    gap: 14px;
    flex-wrap: wrap;
  }

  button {
    padding: 12px 20px;
    background: var(--peacock);
    border: none;
    border-radius: 8px;
    font-size: 16px;
    color: white;
    cursor: pointer;
    transition: 0.25s;
  }

  button:hover {
    background: var(--peacock-dark);
  }

  .secondary {
    background: #6e7c7e;
  }

  .secondary:hover {
    background: #515d5e;
  }

  #billPreview {
    margin-top: 25px;
    background: #F4FEFE;
    border: 1px solid #cceeee;
    border-radius: 12px;
    padding: 20px;
    display: none;
    box-shadow: 0 6px 20px rgba(0,0,0,0.06);
  }

  table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 16px;
  }

  th {
    background: #e1f6f4;
    color: var(--peacock-dark);
    font-weight: 600;
  }

  th, td {
    border: 1px solid #d4ebea;
    padding: 10px;
    font-size: 15px;
  }

  @media (max-width: 720px) {
    .item-row { flex-direction: column; }
    .top-row { flex-direction: column; align-items: flex-start; gap:12px; }
    .back { margin-left:0; }
  }

  :root {
    --peacock: #155B50;
    --peacock-dark: #0D4039;
    --accent: #B95F35;
    --light-bg: #F0F4F2;
    --text: #192E2B;
    --card-bg: #FFFFFF;
    --border: #D8E2DD;
    --muted-text: #687B76;
    --soft-green: #EAF2EE;
    --warm-mark: #E6B25C;
  }

  body {
    min-height: 100vh;
    padding: 36px 22px;
    font-family: "Trebuchet MS", "Lucida Sans Unicode", sans-serif;
    background: linear-gradient(135deg, #EDF3F0 0%, #F7F8F4 58%, #EEF2F0 100%);
    color: var(--text);
  }

  .wrap {
    max-width: 1060px;
    padding: 0 36px 34px;
    border: 1px solid #D9E2DE;
    border-top: 4px solid var(--peacock);
    border-radius: 8px;
    box-shadow: 0 18px 48px rgba(28, 54, 46, 0.09);
    overflow: hidden;
  }

  .page-header {
    padding: 30px 0 24px;
    border-bottom: 1px solid var(--border);
  }

  .eyebrow {
    margin-bottom: 8px;
    color: var(--peacock);
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 1px;
    text-transform: uppercase;
  }

  h2 {
    margin: 0;
    color: var(--text);
    font-family: Georgia, "Times New Roman", serif;
    font-size: 30px;
    font-weight: 600;
  }

  .form-section {
    padding: 26px 0 28px;
    border-bottom: 1px solid var(--border);
  }

  .section-heading {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 21px;
  }

  .section-index {
    display: grid;
    width: 30px;
    height: 30px;
    place-items: center;
    border-radius: 50%;
    background: #F8EEDC;
    color: #825524;
    font-size: 11px;
    font-weight: 700;
  }

  .section-heading h3 {
    margin: 0;
    color: var(--text);
    font-size: 16px;
    font-weight: 700;
  }

  .customer-grid {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 18px 22px;
  }

  .form-field {
    min-width: 0;
  }

  .form-field.full-width {
    grid-column: 1 / -1;
  }

  label {
    margin: 0 0 7px;
    color: #344D48;
    font-size: 13px;
    font-weight: 700;
  }

  input, textarea, select {
    min-height: 46px;
    margin-top: 0;
    padding: 11px 13px;
    border: 1px solid #CAD6D1;
    border-radius: 5px;
    background: #FFFFFF;
    color: var(--text);
    font-family: inherit;
    font-size: 14px;
    transition: border-color 0.16s ease, box-shadow 0.16s ease, background 0.16s ease;
  }

  textarea {
    min-height: 82px;
    resize: vertical;
  }

  input:hover, textarea:hover, select:hover {
    border-color: #97AAA3;
  }

  input:focus, textarea:focus, select:focus {
    border-color: var(--peacock);
    outline: none;
    box-shadow: 0 0 0 3px rgba(21, 91, 80, 0.12);
  }

  .products {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
    gap: 9px;
    margin-top: 0;
  }

  .product-checkbox {
    display: flex;
    min-height: 46px;
    align-items: center;
    padding: 0 12px;
    border: 1px solid #D5E0DB;
    border-radius: 5px;
    background: #FFFFFF;
    color: #354C47;
    font-size: 13px;
    transition: background 0.16s ease, border-color 0.16s ease, transform 0.16s ease;
  }

  .product-checkbox:hover {
    transform: translateY(-1px);
    border-color: #90AAA0;
    background: #F7FAF8;
  }

  .product-checkbox:has(input:checked) {
    border-color: var(--peacock);
    background: var(--soft-green);
    color: var(--peacock-dark);
  }

  .product-checkbox label {
    display: flex;
    width: 100%;
    align-items: center;
    gap: 10px;
    cursor: pointer;
    font-size: 13px;
    font-weight: 600;
  }

  .product-checkbox input {
    width: 16px;
    min-height: 16px;
    height: 16px;
    margin: 0;
    padding: 0;
    accent-color: var(--peacock);
  }

  .field-error {
    margin: 10px 0 0;
    color: #A13F2B;
    font-size: 13px;
    font-weight: 600;
  }

  .item-row {
    display: grid;
    grid-template-columns: minmax(130px, 1fr) minmax(120px, 150px) minmax(120px, 170px) auto auto;
    gap: 12px;
    margin-top: 10px;
    padding: 12px;
    border: 1px solid #D8E2DE;
    border-radius: 5px;
    background: #F8FAF9;
  }

  .item-row > div:first-child {
    display: flex;
    align-items: center;
    padding-left: 4px;
    color: var(--text);
    font-size: 13px;
    text-transform: uppercase;
  }

  .item-row input {
    width: 100%;
  }

  .item-row button {
    min-height: 46px;
    padding: 0 12px;
    border: 1px solid #E5CFC6;
    background: #FFF9F6;
    color: #9D482D;
    font-size: 13px;
  }

  .item-row button:hover {
    background: #FBECE5;
  }

  .item-row .date-toggle {
    display: grid;
    width: 44px;
    min-width: 44px;
    min-height: 44px;
    place-items: center;
    padding: 0;
    border: 1px solid #CAD6D1;
    border-radius: 5px;
    background: #FFFFFF;
    color: var(--peacock-dark);
    font-size: 19px;
  }

  .item-row .date-toggle:hover {
    background: var(--soft-green);
  }

  .item-date-fields {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 12px;
    margin: 0 0 12px;
    padding: 12px;
    border: 1px solid #D8E2DD;
    border-top: 0;
    border-radius: 0 0 8px 8px;
    background: #FFFFFF;
  }

  .item-date-fields[hidden], #sharedDatesFields[hidden] {
    display: none;
  }

  .item-date-fields label, #sharedDatesFields label {
    display: block;
  }

  .item-card {
    margin-top: 12px;
  }

  .item-card .item-row {
    margin-top: 0;
  }

  .product-batches {
    margin-top: 16px;
  }

  .add-batch-button {
    min-height: 38px;
    margin-top: 8px;
    padding: 0 14px;
  }

  .apply-dates-option {
    margin: 0 0 14px;
  }

  .apply-dates-option label {
    display: flex;
    align-items: center;
    gap: 9px;
  }

  .apply-dates-option input {
    width: 16px;
    min-height: 16px;
    margin: 0;
  }

  #sharedDatesFields {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 12px;
    margin-bottom: 14px;
    padding: 14px;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: #F8FAF9;
  }

  .inline-row {
    gap: 20px;
  }

  .inline-row > * {
    min-width: 0;
  }

  .actions {
    justify-content: flex-end;
    gap: 10px;
    margin-top: 24px;
    padding-top: 20px;
    border-top: 1px solid var(--border);
  }

  button {
    min-height: 46px;
    padding: 0 17px;
    border: 1px solid var(--peacock);
    border-radius: 5px;
    background: var(--peacock);
    font-family: inherit;
    font-size: 13px;
    font-weight: 700;
    transition: background 0.16s ease, border-color 0.16s ease, transform 0.16s ease;
  }

  button:hover {
    transform: translateY(-1px);
    border-color: var(--peacock-dark);
    background: var(--peacock-dark);
  }

  button:focus-visible, a:focus-visible, input:focus-visible, textarea:focus-visible {
    outline: 3px solid rgba(185, 95, 53, 0.35);
    outline-offset: 2px;
  }

  .actions .button-outline {
    border-color: #BBCAC4;
    background: #FFFFFF;
    color: var(--peacock-dark);
  }

  .actions .button-outline:hover {
    border-color: var(--peacock);
    background: var(--soft-green);
  }

  .actions .button-share {
    border-color: var(--accent);
    background: var(--accent);
  }

  .actions .button-share:hover {
    border-color: #984522;
    background: #984522;
  }

  .actions .secondary {
    border-color: transparent;
    background: transparent;
    color: var(--muted-text);
  }

  .actions .secondary:hover {
    border-color: #D8E2DE;
    background: #F1F4F2;
    color: var(--text);
  }

  @media (max-width: 720px) {
    body { padding: 16px 10px; }
    .wrap { padding: 0 20px 24px; }
    .page-header { padding: 23px 0 19px; }
    h2 { font-size: 26px; }
    .customer-grid { grid-template-columns: minmax(0, 1fr); gap: 15px; }
    .form-field.full-width { grid-column: auto; }
    .item-row { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
    .item-row > div:first-child { grid-column: 1 / -1; min-height: 25px; }
    .item-row button:not(.date-toggle) { grid-column: 1 / -1; }
    .inline-row { flex-direction: column; gap: 15px; }
    .item-date-fields, #sharedDatesFields { grid-template-columns: minmax(0, 1fr); }
    .actions { justify-content: stretch; }
    .actions button { flex: 1 1 calc(50% - 10px); }
  }

  @media (max-width: 420px) {
    .wrap { padding-right: 15px; padding-left: 15px; }
    .products { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .product-checkbox { padding: 0 8px; }
    .product-checkbox label { gap: 7px; font-size: 12px; }
    .actions { flex-direction: column; }
    .actions button { width: 100%; }
  }
  </style>

</head>
<body>
  <div class="wrap">
    <header class="page-header">
      <div class="eyebrow">SUBRAMANI ENTERPRISES</div>
      <h2>Generate Bill</h2>
    </header>

    <div class="form-sections">
      <section class="form-section" aria-labelledby="customerSectionTitle">
        <div class="section-heading">
          <span class="section-index">01</span>
          <h3 id="customerSectionTitle">Customer details</h3>
        </div>
        <div class="customer-grid">
          <div class="form-field">
            <label for="customerName">Customer Name *</label>
            <input type="text" id="customerName" style="text-transform: uppercase;" oninput="this.value = this.value.toUpperCase()" required>
          </div>
          <div class="form-field">
            <label for="phone">Phone *</label>
            <input type="text" id="phone" maxlength="10" oninput="this.value = this.value.replace(/[^0-9]/g,'').slice(0,10);" required>
          </div>
          <div class="form-field">
            <label for="altPhone">Additional Phone</label>
            <input type="text" id="altPhone" maxlength="10" oninput="this.value = this.value.replace(/[^0-9]/g,'').slice(0,10);">
          </div>
          <div class="form-field full-width">
            <label for="address">Address *</label>
            <textarea id="address" style="text-transform: uppercase;" oninput="this.value = this.value.toUpperCase()" required></textarea>
          </div>
        </div>
      </section>

      <section class="form-section" aria-labelledby="productsSectionTitle">
        <div class="section-heading">
          <span class="section-index">02</span>
          <h3 id="productsSectionTitle">Products</h3>
        </div>
        <div id="productsList" class="products"></div>
        <p id="productValidationMessage" class="field-error" role="alert" hidden></p>
        <div id="itemsContainer"></div>
      </section>

      <section class="form-section" aria-labelledby="rentalSectionTitle">
        <div class="section-heading">
          <span class="section-index">03</span>
          <h3 id="rentalSectionTitle">Default rental period</h3>
        </div>
        <div id="sharedDatesFields" class="inline-row">
          <div class="form-field">
            <label for="sharedStartDate">Default Start Date</label>
            <input type="date" id="sharedStartDate">
          </div>
          <div class="form-field">
            <label for="sharedEndDate">Default End Date</label>
            <input type="date" id="sharedEndDate">
          </div>
        </div>
        <p class="muted">These dates apply to all products unless you set different dates using that item's calendar.</p>
      </section>

      <section class="form-section" aria-labelledby="paymentSectionTitle">
        <div class="section-heading">
          <span class="section-index">04</span>
          <h3 id="paymentSectionTitle">Payment</h3>
        </div>
        <div class="form-field">
          <label for="advance">Advance Amount (Optional)</label>
          <input type="number" id="advance" min="0" step="0.01" placeholder="Leave blank if no advance was paid">
        </div>
      </section>

      <div class="actions">
        <button id="btnPreview">Generate Bill (Preview)</button>
        <button class="button-outline" id="btnDownload">Download Bill</button>
        <button class="button-share" id="btnWhatsApp">Share via WhatsApp</button>
        <button class="secondary" id="btnReset">Reset</button>
      </div>
    </div>

    <div id="billPreview"></div>
  </div>

<script>
  function val(id) {
    const el = document.getElementById(id);
    return el ? el.value : "";
}

  // ---------- CONFIG ----------
  const PRODUCTS = ["xframe","alige","piller box","wheels","painting ladder","motor","supportings","machine","poles","board","ladder","lift","jack"];
  const productsList = document.getElementById('productsList');
  const itemsContainer = document.getElementById('itemsContainer');
  const previewBox = document.getElementById('billPreview');
  let savedPayload = null; // used by download button
  let preparedBillPdf = null;
  let preparedBillSignature = null;
  let preparedBillPromise = null;
  let batchId = 0;
  const defaultStartDate = document.getElementById('sharedStartDate');
  const defaultEndDate = document.getElementById('sharedEndDate');

  function invalidatePreparedBill(){
    savedPayload = null;
    preparedBillPdf = null;
    preparedBillSignature = null;
    preparedBillPromise = null;
  }

  document.getElementById('advance').addEventListener('input', () => {
    invalidatePreparedBill();
  });

  defaultStartDate.addEventListener('input', () => {
    defaultEndDate.min = defaultStartDate.value || '';
    invalidatePreparedBill();
  });
  defaultEndDate.addEventListener('input', invalidatePreparedBill);

  // populate product checkboxes
  PRODUCTS.forEach(p=>{
    const div = document.createElement('div');
    div.className = 'product-checkbox';
    div.innerHTML = `<label style="margin:0;cursor:pointer"><input type="checkbox" id="chk_${p}" /> ${p}</label>`;
    productsList.appendChild(div);
    // listen change on checkbox
    div.querySelector('input').addEventListener('change', (ev)=>{
      toggleProductRow(p, ev.target.checked);
      invalidatePreparedBill();
    });
  });

  function toggleProductRow(prod, isChecked){
    document.getElementById('productValidationMessage').hidden = true;
    invalidatePreparedBill();
    if (isChecked) {
      if (document.getElementById(`batches_${prod}`)) return;
      const group = document.createElement('div');
      group.className = 'product-batches';
      group.id = `batches_${prod}`;
      const addButton = document.createElement('button');
      addButton.type = 'button';
      addButton.className = 'add-batch-button button-outline';
      addButton.textContent = `+ Add ${prod} return batch`;
      addButton.addEventListener('click', () => {
        group.dataset.partialReturns = 'true';
        group.querySelectorAll('.batch-item').forEach(row => {
          const quantityField = row.querySelector('.batch-quantity');
          quantityField.placeholder = 'Quantity returned';
          quantityField.setAttribute('aria-label', `${prod} quantity returned`);
          row.querySelector('.remove-batch-button').textContent = 'Remove batch';
        });
        createBatchRow(prod);
        invalidatePreparedBill();
      });
      group.appendChild(addButton);
      itemsContainer.appendChild(group);
      createBatchRow(prod, false);
    } else {
      const r = document.getElementById(`batches_${prod}`);
      if (r) r.remove();
      invalidatePreparedBill();
      const chk = document.getElementById(`chk_${prod}`);
      if (chk) chk.checked = false;
    }
  }

  function createBatchRow(product, isReturnBatch = true){
    const group = document.getElementById(`batches_${product}`);
    if (!group) return;
    const existingRows = [...group.querySelectorAll('.batch-item')];
    const previousRate = existingRows.at(-1)?.querySelector('.batch-rate')?.value || '';
    const id = ++batchId;
    const row = document.createElement('div');
    row.className = 'item-card batch-item';
    row.dataset.product = product;
    row.innerHTML = `
      <div class="item-row">
        <div><strong>${escapeHtml(product)}</strong></div>
        <input class="batch-rate" aria-label="${escapeHtml(product)} rate per day" placeholder="Rate per day" type="number" min="0.01" step="0.01" value="${escapeHtml(previousRate)}" required>
        <input class="batch-quantity" aria-label="${escapeHtml(product)} ${isReturnBatch ? 'quantity returned' : 'quantity'}" placeholder="${isReturnBatch ? 'Quantity returned' : 'Quantity'}" type="number" min="1" step="1" required>
        <button type="button" class="date-toggle" aria-label="Set dates for ${escapeHtml(product)} return batch ${id}" aria-expanded="false" title="Set return dates">📅</button>
        <button type="button" class="remove-batch-button">${isReturnBatch ? 'Remove batch' : 'Remove item'}</button>
      </div>
      <div class="item-date-fields" hidden>
        <div class="form-field">
          <label for="start_${id}">Start Date</label>
          <input class="batch-start-date" id="start_${id}" type="date" required>
        </div>
        <div class="form-field">
          <label for="return_${id}">Return Date</label>
          <input class="batch-return-date" id="return_${id}" type="date" required>
        </div>
      </div>
    `;
    group.insertBefore(row, group.querySelector('.add-batch-button'));
    row.querySelectorAll('input').forEach(field => {
      field.addEventListener('input', invalidatePreparedBill);
      field.addEventListener('change', () => {
        if (field.classList.contains('batch-start-date')) {
          row.querySelector('.batch-return-date').min = field.value || '';
        }
        invalidatePreparedBill();
      });
    });
    const dateToggle = row.querySelector('.date-toggle');
    const dateFields = row.querySelector('.item-date-fields');
    dateToggle.addEventListener('click', () => {
      dateFields.hidden = !dateFields.hidden;
      dateToggle.setAttribute('aria-expanded', String(!dateFields.hidden));
      if (!dateFields.hidden) row.querySelector('.batch-start-date').focus();
    });
    row.querySelector('.remove-batch-button').addEventListener('click', () => {
      row.remove();
      if (!group.querySelector('.batch-item')) {
        group.remove();
        document.getElementById(`chk_${product}`).checked = false;
      }
      invalidatePreparedBill();
    });
    invalidatePreparedBill();
  }

  function removeProduct(prod){
    const chk = document.getElementById(`chk_${prod}`);
    if (chk) chk.checked = false;
    const r = document.getElementById(`batches_${prod}`);
    if (r) r.remove();
    invalidatePreparedBill();
  }

  function escapeHtml(value){
    return String(value || '').replace(/[&<>\"]/g, character => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'
    }[character]));
  }

  // ---------- PREVIEW ----------
  document.getElementById('btnPreview').addEventListener('click', generatePreview);

  function focusInvalidField(field, message){
    if (!field.dataset.validationHandler) {
      field.addEventListener('input', () => field.setCustomValidity(''));
      field.dataset.validationHandler = 'true';
    }
    const dateFields = field.closest('.item-date-fields');
    if (dateFields) {
      dateFields.hidden = false;
      dateFields.parentElement.querySelector('.date-toggle').setAttribute('aria-expanded', 'true');
    }
    field.setCustomValidity(message);
    field.scrollIntoView({ behavior: 'smooth', block: 'center' });
    field.focus({ preventScroll: true });
    field.reportValidity();
    return false;
  }

  function computeDays(startDate, endDate){
    if (!startDate || !endDate) return 0;
    const parseDate = value => {
      if (!/^\d{4}-\d{2}-\d{2}$/.test(value)) return null;
      const [year, month, day] = value.split('-').map(Number);
      const date = new Date(Date.UTC(year, month - 1, day));
      if (date.getUTCFullYear() !== year || date.getUTCMonth() !== month - 1 || date.getUTCDate() !== day) return null;
      return date;
    };
    const start = parseDate(startDate);
    const end = parseDate(endDate);
    if (!start || !end || end < start) return 0;
    return Math.max(0, Math.floor((end - start) / 86400000) + 1);
  }

  function getBatchDates(row){
    const startDate = row.querySelector('.batch-start-date').value;
    const endDate = row.querySelector('.batch-return-date').value;
    if (startDate || endDate) return { startDate, endDate, hasOverride: true };
    return {
      startDate: defaultStartDate.value,
      endDate: defaultEndDate.value,
      hasOverride: false
    };
  }

  function validateBillForm(){
    const advanceField = document.getElementById('advance');
    advanceField.setCustomValidity('');
    const requiredFields = [
      ['customerName', 'Enter the customer name.'],
      ['phone', 'Enter the customer phone number.'],
      ['address', 'Enter the customer address.']
    ];
    for (const [id, message] of requiredFields) {
      const field = document.getElementById(id);
      if (!field.value.trim()) return focusInvalidField(field, message);
    }

    const selectedProducts = PRODUCTS.filter(product =>
      document.getElementById(`chk_${product}`).checked
    );
    if (selectedProducts.length === 0) {
      const message = document.getElementById('productValidationMessage');
      message.textContent = 'Select at least one product to continue.';
      message.hidden = false;
      productsList.scrollIntoView({ behavior: 'smooth', block: 'center' });
      document.getElementById(`chk_${PRODUCTS[0]}`).focus({ preventScroll: true });
      return false;
    }

    const batchRows = [...itemsContainer.querySelectorAll('.batch-item')];
    if (batchRows.length === 0) return false;
    let total = 0;
    for (const row of batchRows) {
      const product = row.dataset.product;
      const priceField = row.querySelector('.batch-rate');
      const quantityField = row.querySelector('.batch-quantity');
      const startField = row.querySelector('.batch-start-date');
      const endField = row.querySelector('.batch-return-date');
      const dates = getBatchDates(row);
      startField.setCustomValidity('');
      endField.setCustomValidity('');
      if (!priceField.value || !priceField.checkValidity()) {
        return focusInvalidField(priceField, 'Enter a price greater than zero.');
      }
      if (!quantityField.value || !quantityField.checkValidity()) {
        return focusInvalidField(quantityField, 'Enter a whole quantity of at least 1.');
      }
      if (!dates.startDate) {
        return focusInvalidField(
          dates.hasOverride ? startField : defaultStartDate,
          `Enter a start date for this ${product} return batch, or set a default rental period.`
        );
      }
      if (!dates.endDate) {
        return focusInvalidField(
          dates.hasOverride ? endField : defaultEndDate,
          `Enter a return date for this ${product} batch, or set a default rental period.`
        );
      }
      if (!computeDays(dates.startDate, dates.endDate)) {
        return focusInvalidField(
          dates.hasOverride ? endField : defaultEndDate,
          'Return date cannot be before the start date.'
        );
      }
      const days = computeDays(dates.startDate, dates.endDate);
      total += Number(priceField.value) * Number(quantityField.value) * days;
    }

    if (!advanceField.checkValidity()) {
      return focusInvalidField(advanceField, 'Enter a valid non-negative advance amount.');
    }
    if (Number(advanceField.value || 0) > Number(total.toFixed(2))) {
      return focusInvalidField(advanceField, 'Advance amount cannot be greater than the total bill amount.');
    }
    return true;
  }

  function collectItemsFromUI(){
    const items = [];
    for (const row of itemsContainer.querySelectorAll('.batch-item')){
      const product = row.dataset.product;
      const price = Number(row.querySelector('.batch-rate').value);
      const quantity = Number(row.querySelector('.batch-quantity').value);
      const { startDate, endDate } = getBatchDates(row);
      if (!Number.isFinite(price) || price <= 0 || !Number.isInteger(quantity) || quantity <= 0) {
        throw new Error(`Enter valid rate and returned quantity for ${product}`);
      }
      items.push({
        product,
        price,
        quantity,
        startDate,
        endDate,
        totalDays: computeDays(startDate, endDate)
      });
    }
    if (items.length === 0) throw new Error('Select at least one product or return batch');
    return items;
  }

  function generatePreview(){
    if (!validateBillForm()) return;
    try {
     const name = val("customerName");
const phone = val("phone");
const alt = val("altPhone");
const address = val("address");
const advance = Number(val("advance") || 0);


      const items = collectItemsFromUI();

      const rows = items.map(it=>{
        const amount = Number(it.price) * Number(it.quantity) * it.totalDays;
        return { ...it, amount };
      });
      const grand = rows.reduce((sum, item) => sum + item.amount, 0);

      savedPayload = {
        name, phone, alt_phone: alt, address, advance,
        items: items.map(({ product, price, quantity, startDate, endDate, totalDays }) => ({
          product, price, quantity, startDate, endDate, totalDays
        }))
      };
      prepareBillPdf();

      // render preview
      let html = `<div style="display:flex;justify-content:space-between;align-items:center">
                    <div><h3 style="margin:0;text-decoration:underline;">SUBRAMANI ENTERPRISES</h3>
                    <div class="muted">Phone: 9916067960, 8073024022</div></div>
                    <div style="text-align:right"><small>${new Date().toLocaleDateString()}</small></div>
                  </div>
                  <hr/>
                  <div><strong>Name: ${escapeHtml(name)}</strong> &nbsp; <strong>Phone:</strong> ${escapeHtml(phone)}</div>
                  <div><strong>Address:</strong> ${escapeHtml(address)}</div>
                  <table>
                    <thead><tr><th>Item Name</th><th>Start Date</th><th>Return Date</th><th>Total Days</th><th>Qty Returned</th><th>Rate/Day</th><th>Line Total</th></tr></thead><tbody>`;

      rows.forEach(r=> {
        html += `<tr><td>${escapeHtml(r.product).toUpperCase()}</td><td>${r.startDate}</td><td>${r.endDate}</td><td>${r.totalDays}</td><td>${r.quantity}</td><td>₹ ${Number(r.price).toFixed(2)}</td><td>₹ ${Number(r.amount).toFixed(2)}</td></tr>`;
      });

      const grandTotal = Number(grand.toFixed(2));
      html += `<tr><td colspan="6" style="text-align:right"><strong>Total</strong></td><td><strong>₹ ${grandTotal.toFixed(2)}</strong></td></tr>`;
      if (advance > 0) {
        const balance = grandTotal - advance;
        html += `<tr><td colspan="6" style="text-align:right"><strong>ADVANCE</strong></td><td><strong>₹ ${advance.toFixed(2)}</strong></td></tr>`;
        html += `<tr><td colspan="6" style="text-align:right"><strong>BALANCE AMT</strong></td><td><strong>₹ ${balance.toFixed(2)}</strong></td></tr>`;
      }
      html += `</tbody></table>`;

      previewBox.innerHTML = html;
      previewBox.style.display = 'block';
      previewBox.scrollIntoView({behavior:'smooth'});
    } catch (err) {
      alert(err.message || 'Error building preview');
    }
  }

  async function requestBillPdf(payload){
    const res = await fetch('/api/generate-bill', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify(payload)
    });
    if (!res.ok) {
      const data = await res.json().catch(() => ({}));
      throw new Error(data.error || 'Error generating bill');
    }
    const disposition = res.headers.get('Content-Disposition') || '';
    const encodedFilename = disposition.match(/filename\*=UTF-8''([^;]+)/i)?.[1];
    const fallbackFilename = disposition.match(/filename="?([^";]+)"?/i)?.[1];
    return {
      blob: await res.blob(),
      filename: (encodedFilename && decodeURIComponent(encodedFilename)) || fallbackFilename || 'customer.pdf'
    };
  }

  function prepareBillPdf(){
    const signature = JSON.stringify(savedPayload);
    if (preparedBillSignature === signature && preparedBillPromise) return;
    preparedBillSignature = signature;
    preparedBillPdf = null;
    preparedBillPromise = requestBillPdf(savedPayload)
      .then(bill => {
        if (JSON.stringify(savedPayload) === signature) {
          preparedBillPdf = { ...bill, signature };
        }
        return bill;
      })
      .catch(err => {
        console.error('Could not prepare bill PDF:', err);
        return null;
      });
  }

  async function getBillPdf(){
    if (!savedPayload) generatePreview();
    if (!savedPayload) return null;

    const signature = JSON.stringify(savedPayload);
    if (preparedBillPdf?.signature === signature) return preparedBillPdf;
    if (preparedBillSignature === signature && preparedBillPromise) {
      const bill = await preparedBillPromise;
      if (bill) return bill;
    }

    const bill = await requestBillPdf(savedPayload);
    preparedBillPdf = { ...bill, signature };
    preparedBillSignature = signature;
    return preparedBillPdf;
  }

  function downloadPdf(blob, filename){
    const downloadUrl = URL.createObjectURL(blob);
    const link = document.createElement('a');
    link.href = downloadUrl;
    link.download = filename;
    document.body.appendChild(link);
    link.click();
    link.remove();
    setTimeout(() => URL.revokeObjectURL(downloadUrl), 1000);
  }

  function getBillShareText(){
    const grandTotal = Number(savedPayload.items.reduce((sum, item) => {
      const days = computeDays(item.startDate, item.endDate);
      return sum + item.price * item.quantity * days;
    }, 0).toFixed(2));
    const advance = Number(savedPayload.advance || 0);
    const lines = savedPayload.items.map(item =>
      `${item.product}: ${item.quantity} x Rs. ${Number(item.price).toFixed(2)} x ${computeDays(item.startDate, item.endDate)} day(s) | ${item.startDate || '-'} to ${item.endDate || '-'}`
    );
    return [
      'SUBRAMANI ENTERPRISES - Bill',
      `Customer: ${savedPayload.name}`,
      `Phone: ${savedPayload.phone}`,
      ...lines,
      `Total: Rs. ${grandTotal.toFixed(2)}`,
      ...(advance > 0
        ? [`Advance: Rs. ${advance.toFixed(2)}`, `Balance amount: Rs. ${(grandTotal - advance).toFixed(2)}`]
        : [])
    ].filter(Boolean).join('\n');
  }

  // ---------- DOWNLOAD PDF ----------
  document.getElementById('btnDownload').addEventListener('click', async ()=>{
    if (!validateBillForm()) return;
    try {
      const bill = await getBillPdf();
      if (bill) downloadPdf(bill.blob, bill.filename);
    } catch (err) {
      console.error(err);
      alert(err.message || 'Server error while generating bill');
    }
  });

  // ---------- SHARE VIA WHATSAPP ----------
  document.getElementById('btnWhatsApp').addEventListener('click', ()=>{
    if (!validateBillForm()) return;
    if (!savedPayload) generatePreview();
    if (!savedPayload) return;

    const shareText = getBillShareText();
    const signature = JSON.stringify(savedPayload);
    const readyBill = preparedBillPdf?.signature === signature ? preparedBillPdf : null;
    const shareUrl = `https://wa.me/?text=${encodeURIComponent(shareText)}`;

    if (readyBill) {
      const file = new File([readyBill.blob], readyBill.filename, { type: 'application/pdf' });
      if (navigator.canShare?.({ files: [file] }) && navigator.share) {
        try {
          navigator.share({ title: 'Bill from SUBRAMANI ENTERPRISES', text: shareText, files: [file] })
            .catch(err => {
              if (err.name !== 'AbortError') {
                console.error(err);
                alert('Could not share the PDF. Download it and attach it in WhatsApp instead.');
              }
            });
          return;
        } catch (err) {
          console.error(err);
        }
      }
    }

    window.open(shareUrl, '_blank');
    getBillPdf().then(bill => {
      if (bill) downloadPdf(bill.blob, bill.filename);
    }).catch(err => {
      console.error(err);
      alert(err.message || 'Could not generate the PDF bill');
    });
  });

  // ---------- RESET ----------
  document.getElementById('btnReset').addEventListener('click', ()=>{
    document.getElementById('customerName').value = '';
    document.getElementById('phone').value = '';
    document.getElementById('altPhone').value = '';
    document.getElementById('address').value = '';
    document.getElementById('advance').value='';
    defaultStartDate.value = '';
    defaultEndDate.value = '';
    defaultEndDate.min = '';
    previewBox.style.display = 'none';
    savedPayload = null;
    preparedBillPdf = null;
    preparedBillSignature = null;
    preparedBillPromise = null;
    // remove rows & uncheck products
    PRODUCTS.forEach(p=>{
      const chk = document.getElementById(`chk_${p}`);
      if (chk) chk.checked = false;
      const r = document.getElementById(`batches_${p}`);
      if (r) r.remove();
    });
  });

  // ---------- init ----------
  (function init(){ /* nothing to do for now */ })();

</script>
</body>
</html>
